<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#D5DEEE;overflow:hidden;-webkit-tap-highlight-color:transparent}

#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:none}
#stage iframe.on{display:block;z-index:2}

#stage iframe.pre{display:block;visibility:hidden;pointer-events:none;z-index:0}
#stage iframe.on.pre{visibility:visible;pointer-events:auto}

#stage iframe.out{display:block;z-index:1;pointer-events:none}
#stage iframe.in-push{animation:mzPush .32s cubic-bezier(.22,.8,.24,1) both}

सकते हैं।']},\n      {i:'list',t:'इतिहास',s:['इतिहास में सिर्फ़ ये दौर और पिछला दौर दिखता है। इसे सिर्फ़ पढ़ा जा सकता है।','पुराने दौर सिस्टम अपने आप हटा देता है। घरों की गिनती को कभी नहीं छूता।']},\n      {i:'shield',t:'हिफ़ाज़त',s:['सिस्टम चालू या बंद करने पर आपका पिन पूछा जाता है।','प्रोफ़ाइल से बैकअप लें। अपने आप बैकअप हर रविवार रात होता है।','अगर किसी और को आपका पिन पता हो, तो प्रोफ़ाइल से पिन बदलें।']},\n      {i:'share',t:'नया एडमिन जोड़ना',s:['\"लिंक भेजें\" दबाएँ और लिंक WhatsApp या SMS पर भेजें।','नया व्यक्ति लिंक खोलकर मोबाइल नंबर, नाम और पिन डालता है और सीधे अंदर आ जाता है। किसी की मंज़ूरी नहीं चाहिए।','सबको संदेश मिलता है: फलाँ जुड़ा। अगर कोई ग़लत व्यक्ति जुड़ जाए, तो उसे खोलकर कचरे का निशान दबाएँ।']},\n      {i:'lock',t:'पिन भूल गए',s:['अपना मोबाइल नंबर डालकर आगे बढ़ें दबाएँ। फिर \"पिन भूल गए?\" और \"रिक्वेस्ट भेजें\" दबाएँ।','रिक्वेस्ट सिर्फ़ एक बार भेजें। कोई एडमिन आपको फ़ोन करके पिन रीसेट करेगा।','फिर लॉगिन करके नया पिन बना लें।','एडमिन के लिए: \"एडमिन\" में सबसे ऊपर \"पिन भूल गए\" का कार्ड आता है। पहले उस व्यक्ति को फ़ोन करें, फिर \"पिन रीसेट करें\" दबाकर अपना पिन डालें।']},\n      {i:'bell',t:'सूचनाएँ',s:['सूचना को बगल में सरकाएँ तो हट जाती है। कई चुनने के लिए किसी एक को दबाए रखें, फिर सब साथ हटाएँ।','ज़रूरी सूचनाएँ: रद्द दावत, ख़ास दावत, सिस्टम चालू या बंद, और दौर पूरा।']},\n      {i:'list',t:'दौर का रास्ता',s:['इसमें दिखता है कि पहले किसने दावत की, आज कौन है और आगे कौन आएगा।','किसी घर को दबाएँ तो उसकी प्रोफ़ाइल खुलती है। \"आज\" बटन से आज पर लौट आते हैं।']}]\n  },ur:{\n    admins:'ایڈمن',ct2:[{i:'round',t:'دور',s:['ایک دور کا مطلب ہے کہ ہر گھر کی ایک باری ہو جائے۔','آخری گھر کی باری پوری ہوتے ہی نیا دور اپنے آپ شروع ہو جاتا ہے۔ جن گھروں کی باری \"باقی\" رہ گئی تھی، وہ پہلے آتے ہیں۔','\"مزید\" میں دور دکھتا ہے: کون سا دور ہے، کتنے گھر ہو چکے اور تقریباً کتنے دن باقی ہیں۔']},{i:'power',t:'دعوت روکنا',s:['کچھ دن دعوت نہ ہو، جیسے مولانا باہر ہوں، تب سسٹم بند کریں۔ اس میں آپ کا پن پوچھا جاتا ہے۔','ہوم پر \"سسٹم\" دبائیں، یا \"مزید\" میں سوئچ استعمال ک
